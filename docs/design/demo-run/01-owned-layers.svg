<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Owned Layers: parallel work design</title><desc id="desc">Illustrative authoring state. A and C have host-observed launches with no completion or publication yet. B waits for published peers. Assignments are not evidence of actual changes.</desc>
<rect width="1440" height="960" fill="#f5f2eb"/>
<text x="32" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#201d18">Strata</text>
<line x1="130" y1="22" x2="130" y2="48" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="150" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">RUN DEMO</text>
<rect x="962" y="20" width="446" height="28" rx="4" fill="#f5f2eb" stroke="#62594d"/>
<text x="972" y="39" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">DESIGN ILLUSTRATION · NOT A RUN</text>
<line x1="32" y1="67" x2="1408" y2="67" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="32" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#a94f13">LIVE VIEW DESIGN / AUTHORS</text>
<text x="32" y="159" font-family="Georgia,serif" font-size="38" font-weight="400" fill="#201d18">Separate proposals. Shared intent.</text>
<text x="32" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#62594d">A and C launch observations overlap. Publication remains a separate fact.</text>
<text x="32" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">01  Blocks</text>
<text x="222" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#a94f13">02  Layers</text>
<text x="412" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">03  Composition</text>
<text x="602" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">04  Resolution</text>
<text x="792" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">05  Release</text>
<line x1="32" y1="249" x2="1408" y2="249" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="32" y="929" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Static design proposal · Source-bound states; no controls execute actions.</text>
<text x="995" y="929" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Owned proposals. Explicit human decisions.</text>
<rect x="32" y="273" width="914" height="618" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<rect x="970" y="273" width="438" height="618" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<text x="56" y="310" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">PINNED BASELINE  R0@1</text>
<text x="56" y="341" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">app  /  booking</text>
