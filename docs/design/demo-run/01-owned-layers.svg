<path d="M 434 410 L 425 415 L 434 420" stroke="#24516b" stroke-width="1.5" fill="none"/>
<text x="446" y="388" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#24516b">consumes</text>
<text x="446" y="404" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#24516b">hold duration</text>
<text x="56" y="554" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">OWNED LAYERS</text>
<text x="468" y="554" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Assignments below are not published changes.</text>
<rect x="56" y="578" width="278" height="262" rx="8" fill="#fbf3e5" stroke="#d8d0c3"/>
<rect x="72" y="595" width="74" height="28" rx="4" fill="#fbf3e5" stroke="#a94f13"/>
<text x="82" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#a94f13">Actor A</text>
<text x="72" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#201d18">L-hold</text>
<text x="72" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">ASSIGNED</text>
<text x="72" y="717" font-family="Georgia,serif" font-size="21" font-weight="400" fill="#201d18">10 → 15 minutes</text>
<text x="72" y="744" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">booking.hold / expiry</text>
<line x1="72" y1="762" x2="318" y2="762" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="72" y="790" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#a94f13">Launch observed</text>
<text x="72" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">No publication observed</text>
<rect x="350" y="578" width="278" height="262" rx="8" fill="#fbf3e5" stroke="#d8d0c3"/>
<rect x="366" y="595" width="74" height="28" rx="4" fill="#fbf3e5" stroke="#a94f13"/>
<text x="376" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#a94f13">Actor C</text>
<text x="366" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#201d18">L-alternative</text>
<text x="366" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">ASSIGNED</text>
<text x="366" y="717" font-family="Georgia,serif" font-size="21" font-weight="400" fill="#201d18">10 → 20 minutes</text>
<text x="366" y="744" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">booking.hold / expiry</text>
<line x1="366" y1="762" x2="612" y2="762" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="366" y="790" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#a94f13">Launch observed</text>
<text x="366" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">No publication observed</text>
<rect x="644" y="578" width="278" height="262" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<rect x="660" y="595" width="74" height="28" rx="4" fill="#fbf3e5" stroke="#a94f13"/>
<text x="670" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#a94f13">Actor B</text>
<text x="660" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#201d18">L-reminder</text>
<text x="660" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">ASSIGNED</text>
<text x="660" y="717" font-family="Georgia,serif" font-size="21" font-weight="400" fill="#201d18">Add one reminder</text>
<text x="660" y="744" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">booking.reminder / timing</text>
<line x1="660" y1="762" x2="906" y2="762" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="660" y="790" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#62594d">Waiting for published peers</text>
<text x="660" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">No publication observed</text>
<text x="56" y="869" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Lane order and position grant no priority. Each actor writes only its own Layer.</text>
<text x="994" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#a94f13">OBSERVED NOW</text>
<text x="994" y="352" font-family="Georgia,serif" font-size="24" font-weight="400" fill="#201d18">Two invocation windows</text>
<text x="994" y="383" font-family="Georgia,serif" font-size="24" font-weight="400" fill="#201d18">overlap.</text>
<text x="994" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">The host observed launches for A and C.</text>
<text x="994" y="450" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">Neither completion has been observed.</text>
<text x="994" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">This is not a measure of active reasoning.</text>
<line x1="994" y1="500" x2="1384" y2="500" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="994" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#201d18">What changes next?</text>
<text x="994" y="568" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">Accepted publication reveals an exact</text>
<text x="994" y="594" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">Layer revision and its proposed changes.</text>
<text x="994" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">B then reads the published peers before</text>
<text x="994" y="646" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">authoring the dependent reminder.</text>
<rect x="994" y="698" width="390" height="86" rx="8" fill="#f5f2eb" stroke="#d8d0c3"/>
<text x="1010" y="727" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#42654d">Runner connection: connected</text>
<text x="1010" y="756" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Last observation and checkpoint shown here</text>
<text x="994" y="829" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">View evidence and event log  →</text>
