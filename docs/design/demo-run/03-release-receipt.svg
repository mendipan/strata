<text x="150" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">RUN DEMO</text>
<rect x="962" y="20" width="446" height="28" rx="4" fill="#f5f2eb" stroke="#62594d"/>
<text x="972" y="39" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">DESIGN ILLUSTRATION · NOT A RUN</text>
<line x1="32" y1="67" x2="1408" y2="67" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="32" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#a94f13">RECORDED RUN VIEW DESIGN / COMPLETED</text>
<text x="32" y="159" font-family="Georgia,serif" font-size="38" font-weight="400" fill="#201d18">A tested Release. A reusable baseline.</text>
<text x="32" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#62594d">Reviewed intent and evidence carry forward. This run’s temporary resources have been removed.</text>
<text x="32" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">01  Blocks</text>
<text x="222" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">02  Layers</text>
<text x="412" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">03  Composition</text>
<text x="602" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">04  Resolution</text>
<text x="792" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#a94f13">05  Release</text>
<line x1="32" y1="249" x2="1408" y2="249" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="32" y="929" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Static design proposal · Source-bound states; no controls execute actions.</text>
<text x="995" y="929" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Owned proposals. Explicit human decisions.</text>
<rect x="32" y="273" width="914" height="339" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<rect x="970" y="273" width="438" height="618" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<text x="56" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#42654d">RELEASE VALIDATED</text>
<text x="56" y="354" font-family="Georgia,serif" font-size="38" font-weight="400" fill="#201d18">20-minute hold</text>
<text x="56" y="391" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#201d18">One reminder, 60 seconds before expiry</text>
<text x="56" y="430" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#62594d">Selected: L-alternative@1 + L-reminder@2</text>
<text x="56" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Exact Release reference appears from the verified record.</text>
<line x1="56" y1="489" x2="920" y2="489" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="56" y="525" font-family="Georgia,serif" font-size="38" font-weight="400" fill="#42654d">6</text>
<text x="96" y="525" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">mechanical checks passed</text>
<text x="501" y="525" font-family="Georgia,serif" font-size="38" font-weight="400" fill="#a94f13">4</text>
<text x="542" y="525" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">scripted purpose reviews</text>
<text x="56" y="565" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">Separate recorded choices: duration → revised reminder → Release approval</text>
<rect x="32" y="636" width="914" height="255" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<text x="56" y="674" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#42654d">INHERITED BEHAVIOR VERIFIED</text>
<text x="56" y="711" font-family="Georgia,serif" font-size="26" font-weight="400" fill="#201d18">The inherited realization matched.</text>
<text x="56" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">Reported successful-run outcome · illustrated checkpoints, intervals not to scale</text>
