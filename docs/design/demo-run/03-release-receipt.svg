<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Release and cleanup receipt design</title><desc id="desc">Illustrative completion state based on the successful 20-minute scenario. Six mechanical checks and four scripted purpose reviews are separate. Inherited behavior and cleanup have their own evidence states.</desc>
<rect width="1440" height="960" fill="#f5f2eb"/>
<text x="32" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#201d18">Strata</text>
