<text x="874" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#201d18">1200s</text>
<text x="72" y="824" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Hold starts</text>
<text x="460" y="824" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Reminder</text>
<text x="863" y="824" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Expiry</text>
<text x="56" y="870" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Fixture time · an evidence visualization, not a generated booking website.</text>
