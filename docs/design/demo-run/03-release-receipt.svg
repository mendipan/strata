<text x="994" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">RETAINED</text>
<text x="994" y="653" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">Private Worker and Workflow</text>
<text x="994" y="680" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">Local run evidence and Release proof</text>
