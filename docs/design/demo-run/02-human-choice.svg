<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">First human choice design</title><desc id="desc">Illustrative first selection screen with no option selected. Fifteen minutes retains the original reminder; twenty minutes currently disables it and requires B revision two and a fresh review in the four-process demo.</desc>
<rect width="1440" height="960" fill="#f5f2eb"/>
<text x="32" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#201d18">Strata</text>
<line x1="130" y1="22" x2="130" y2="48" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="150" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">RUN DEMO</text>
<rect x="962" y="20" width="446" height="28" rx="4" fill="#f5f2eb" stroke="#62594d"/>
<text x="972" y="39" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">DESIGN ILLUSTRATION · NOT A RUN</text>
<line x1="32" y1="67" x2="1408" y2="67" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="32" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#a94f13">LIVE VIEW DESIGN / HUMAN DECISION</text>
<text x="32" y="159" font-family="Georgia,serif" font-size="38" font-weight="400" fill="#201d18">Choose the hold duration.</text>
<text x="32" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#62594d">Both proposals change expiry. The reminder currently requires L-hold@1 and assumes 900 seconds.</text>
<text x="32" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">01  Blocks</text>
<text x="222" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">02  Layers</text>
<text x="412" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">03  Composition</text>
<text x="602" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#a94f13">04  Resolution</text>
<text x="792" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">05  Release</text>
<line x1="32" y1="249" x2="1408" y2="249" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="32" y="929" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Static design proposal · Source-bound states; no controls execute actions.</text>
<text x="995" y="929" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Owned proposals. Explicit human decisions.</text>
<rect x="32" y="273" width="914" height="618" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<rect x="970" y="273" width="438" height="618" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<text x="56" y="309" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#62594d">EXACT PACKET · FIRST REVIEW</text>
<text x="56" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#62594d">Baseline: 10 minutes · Reminder disabled</text>
<rect x="56" y="365" width="421" height="425" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<circle cx="81" cy="398" r="9" fill="#fffdf8" stroke="#62594d" stroke-width="1.5"/>
<text x="103" y="409" font-family="Georgia,serif" font-size="31" font-weight="400" fill="#201d18">15 minutes</text>
<text x="76" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#62594d">600 → 900 seconds</text>
<line x1="76" y1="477" x2="457" y2="477" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="76" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">THIS PACKET SELECTS</text>
<text x="76" y="537" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">L-hold@1</text>
<text x="76" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">L-reminder@1</text>
<text x="76" y="609" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">REMINDER EFFECT</text>
<text x="76" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">Once at minute 14</text>
<text x="76" y="664" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">Expected; not yet measured</text>
<text x="76" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">NEXT STEP</text>
<text x="76" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">Materialize and measure.</text>
<rect x="501" y="365" width="421" height="425" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<circle cx="526" cy="398" r="9" fill="#fffdf8" stroke="#62594d" stroke-width="1.5"/>
<text x="548" y="409" font-family="Georgia,serif" font-size="31" font-weight="400" fill="#201d18">20 minutes</text>
<text x="521" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#62594d">600 → 1200 seconds</text>
<line x1="521" y1="477" x2="902" y2="477" stroke="#d8d0c3" stroke-width="1.5"/>
<text x="521" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">THIS PACKET SELECTS</text>
<text x="521" y="537" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">L-alternative@1</text>
<text x="521" y="609" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">REMINDER EFFECT</text>
<text x="521" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">Off in this initial candidate</text>
<text x="521" y="664" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#201d18">Needs a new revision for the demo</text>
<text x="521" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#62594d">NEXT STEP</text>
<text x="521" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">B repairs its dependency.</text>
<text x="521" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">You review a new packet.</text>
<rect x="56" y="811" width="866" height="55" rx="8" fill="#fbf3e5" stroke="#d8d0c3"/>
<text x="72" y="834" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#201d18">Preserved: exclusivity and declared acceptance.</text>
<text x="72" y="854" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#62594d">Inspect the full considered set, set-aside Layers, assumptions, and remaining gates.</text>
<text x="994" y="310" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#a94f13">YOUR DECISION</text>
<text x="994" y="353" font-family="Georgia,serif" font-size="25" font-weight="400" fill="#201d18">No choice is selected.</text>
<text x="994" y="395" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">Choose an option, then explain why.</text>
<text x="994" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62594d">This response does not approve a Release.</text>
<text x="994" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#201d18">Why this choice?</text>
<rect x="994" y="494" width="390" height="125" rx="8" fill="#fffdf8" stroke="#d8d0c3"/>
<text x="1008" y="523" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">Explain the tradeoff you are accepting.</text>
<rect x="994" y="639" width="390" height="46" rx="5" fill="#e7e1d6" stroke="#d8d0c3"/>
<text x="1010" y="668" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#62594d">Select a duration to continue</text>
<rect x="994" y="697" width="390" height="46" rx="8" fill="#f5f2eb" stroke="#d8d0c3"/>
<text x="1010" y="726" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#201d18">Defer and clean up</text>
<text x="994" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">Review expiry comes from the current packet.</text>
<text x="994" y="806" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">A changed packet needs a fresh response.</text>
<text x="994" y="853" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#62594d">Exact packet and evidence  →</text>
</svg>